services:
  - type: web
    name: bookinguru-dashboard-demo
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AUTH_DISABLED
        value: "true"
      - key: DASHBOARD_USER
        value: bookinguru
      - key: DASHBOARD_PASS
        value: investor2026
      - key: AUTO_SYNC
        value: "false"
